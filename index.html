<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatat keuangan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-wallet"></i> APLIKASI PENCATAT KEUANGAN</h1>
        <nav class="nav-buttons">
            <button onclick="switchPage('home')" id="btn-home" class="active"><i class="fa-solid fa-house"></i> Tambah</button>
            <button onclick="switchPage('history')" id="btn-history"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</button>
            <button onclick="switchPage('stats')" id="btn-stats"><i class="fa-solid fa-chart-pie"></i> Statistik</button>
        </nav>
    </header>
    <main>

        <div id="page-home" class="page">
            <section class="summary-container">
                <div class="card total">
                    <h3><i class="fa-solid fa-scale-balanced"></i> Total Saldo</h3>
                    <p id="total-saldo">Rp 0</p>
                </div>
                <div class="card income">
                    <h3><i class="fa-solid fa-arrow-trend-up"></i> Pemasukan</h3>
                    <p id="total-pemasukan">Rp 0</p>
                </div>
                <div class="card expense">
                    <h3><i class="fa-solid fa-arrow-trend-down"></i> Pengeluaran</h3>
                    <p id="total-pengeluaran">Rp 0</p>
                </div>
            </section>
 
            <section class="form-container">
                <h2><i class="fa-solid fa-file-circle-plus"></i> Form Tambah Transaksi</h2>
                <form id="transaction-form">
                    <div class="input-group">
                        <label for="description"><i class="fa-solid fa-pen-to-square"></i> Keterangan Transaksi:</label>
                        <input type="text" id="description" placeholder="cth: Gaji bulanan / Beli makanan" required>
                    </div>

                    <div class="input-group">
                        <label for="amount"><i class="fa-solid fa-money-bill-wave"></i> Nominal (Rp):</label>
                        <input type="number" id="amount" placeholder="cth: 50000" required>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-tags"></i> Jenis Transaksi:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="type" value="income" checked> <i class="fa-solid fa-circle-check" style="color: #10B981;"></i> Pemasukan</label>
                            <label><input type="radio" name="type" value="expense"> <i class="fa-solid fa-circle-xmark" style="color: #EF4444;"></i> Pengeluaran</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> SIMPAN TRANSAKSI</button>
                </form>
            </section>
        </div>

        <div id="page-history" class="page" style="display: none;">
            <section class="history-container">
                <h2><i class="fa-solid fa-list-ul"></i> Riwayat Transaksi</h2>
                <ul id="transaction-list">
                </ul>
                <button onclick="switchPage('home')" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Form</button>
            </section>
        </div>

        <div id="page-stats" class="page" style="display: none;">
            <section class="form-container">
                <h2><i class="fa-solid fa-chart-line"></i> Statistik Keuangan</h2>
                <div class="card total" style="margin-bottom: 15px; background-color: #2563EB;">
                    <h3><i class="fa-solid fa-percent"></i> Rasio Pengeluaran</h3>
                    <p id="stat-ratio">0% dari Pemasukan</p>
                </div>
                <p style="font-size: 0.9rem; color: #065F46; text-align: center; line-height: 1.5;">
                    <i class="fa-solid fa-circle-info"></i> Statistik ini dihitung secara otomatis berdasarkan perbandingan total pengeluaran dan total pemasukan Anda.
                </p>
                <button onclick="switchPage('home')" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Form</button>
            </section>
        </div>
    </main>

</body>
</html>
