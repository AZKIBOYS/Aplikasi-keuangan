<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatat keuangan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-wallet"></i> APLIKASI PENCATAT KEUANGAN</h1>
        <nav class="nav-buttons">
            <button onclick="switchPage('home')" id="btn-home" class="active"><i class="fa-solid fa-house"></i> Tambah</button>
            <button onclick="switchPage('history')" id="btn-history"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</button>
            <button onclick="switchPage('stats')" id="btn-stats"><i class="fa-solid fa-chart-pie"></i> Statistik</button>
        </nav>
    </header>
    <main>

        <div id="page-home" class="page">
            <section class="summary-container">
                <div class="card total">
                    <h3><i class="fa-solid fa-scale-balanced"></i> Total Saldo</h3>
                    <p id="total-saldo">Rp 0</p>
                </div>
                <div class="card income">
                    <h3><i class="fa-solid fa-arrow-trend-up"></i> Pemasukan</h3>
                    <p id="total-pemasukan">Rp 0</p>
                </div>
                <div class="card expense">
                    <h3><i class="fa-solid fa-arrow-trend-down"></i> Pengeluaran</h3>
                    <p id="total-pengeluaran">Rp 0</p>
                </div>
            </section>
            
</body>
</html>
